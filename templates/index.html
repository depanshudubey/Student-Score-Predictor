<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Score Predictor | AI/ML</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="badge">🤖 MACHINE LEARNING</div>

        <h1>Student Score Predictor</h1>

        <p class="subtitle">
            Predict a student's final score using
            Machine Learning.
        </p>


        <form action="/predict" method="POST">

            <label>Hours Studied</label>

            <input
                type="number"
                name="hours"
                step="0.1"
                min="0"
                placeholder="Example: 7"
                required
            >


            <label>Attendance (%)</label>

            <input
                type="number"
                name="attendance"
                min="0"
                max="100"
                placeholder="Example: 85"
                required
            >


            <label>Sleep Hours</label>

            <input
                type="number"
                name="sleep"
                step="0.1"
                min="0"
                max="24"
                placeholder="Example: 8"
                required
            >


            <label>Previous Score</label>

            <input
                type="number"
                name="previous"
                min="0"
                max="100"
                placeholder="Example: 70"
                required
            >


            <button type="submit">
                Predict Final Score →
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <p>Predicted Final Score</p>

            <h2>{{ prediction }} / 100</h2>

        </div>


        <div class="model-info">

            <div>
                <strong>99.7%</strong>
                <span>R² Score</span>
            </div>

            <div>
                <strong>0.75</strong>
                <span>MAE</span>
            </div>

            <div>
                <strong>Linear Regression</strong>
                <span>Algorithm</span>
            </div>

        </div>


        <div class="chart-box">

            <h3>Input Analysis</h3>

            <canvas id="predictionChart"></canvas>

        </div>


        <script>

            const ctx =
                document
                .getElementById("predictionChart")
                .getContext("2d");


            new Chart(ctx, {

                type: "bar",

                data: {

                    labels: [
                        "Hours Studied",
                        "Attendance",
                        "Sleep Hours",
                        "Previous Score"
                    ],

                    datasets: [

                        {
                            label: "Student Inputs",

                            data: [
                                {{ request.form.get('hours') }},
                                {{ request.form.get('attendance') }},
                                {{ request.form.get('sleep') }},
                                {{ request.form.get('previous') }}
                            ],

                            backgroundColor: [
                                "#c7ff3d",
                                "#9ed42e",
                                "#7ca91f",
                                "#5e8015"
                            ],

                            borderRadius: 8

                        }

                    ]

                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {
                            labels: {
                                color: "#aaa"
                            }
                        }

                    },

                    scales: {

                        x: {
                            ticks: {
                                color: "#aaa"
                            },

                            grid: {
                                color: "#222"
                            }
                        },

                        y: {

                            beginAtZero: true,

                            ticks: {
                                color: "#aaa"
                            },

                            grid: {
                                color: "#222"
                            }

                        }

                    }

                }

            });

        </script>

        {% endif %}

    </div>

</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
